name: CI/CD QA Pipeline workflow

on:
  # Push-driven previews: every push to a feature branch triggers a Vercel preview.
  # main and hotfix/* are excluded (handled by the prod pipeline).
  # qa is included: it runs tests but hits the no-op log step (Vercel Git integration deploys qa).
  push:
    branches-ignore:
      - main
      - "hotfix/*"

# Defined at the root level, applying to all jobs by default
permissions:
  contents: read

jobs:
  test:
    name: Run QA Tests
    runs-on: ubuntu-latest
    environment: "ProductionQA"
    timeout-minutes: 10
    concurrency:
      # Push-only workflow: github.head_ref is always empty, so key purely on github.ref.
      group: qa-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      ENV_TYPE: ${{ vars.ENV_TYPE }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Ensure origin/qa is present so `jest --changedSince=origin/qa` can resolve it.
      - name: Fetch qa ref for diff
        run: git fetch origin qa:refs/remotes/origin/qa || git fetch origin qa

      - name: Echo environment name
        run: echo "Environment is $ENV_TYPE"

      - name: Echo github variables
        env:
          GH_REF: ${{ github.ref }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_IS_BASE: ${{ github.ref == github.base_ref }}
        run: echo "The ref - $GH_REF, event name - $GH_EVENT_NAME, branch name - $GH_HEAD_REF, name - $GH_REF_NAME, main is - $GH_IS_BASE"

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run Linting
      - name: Run Linting
        run: npm run lint

      # 5. Run Unit Tests for changed files (against qa base)
      - name: Run tests
        run: npm run test -- --changedSince=origin/qa --coverageReporters=json-summary --coverageReporters=text

      - name: Extract Coverage
        id: coverage # <--- Important: This ID is used to reference outputs later
        run: |
          set -euo pipefail
          # Guard: when there are no changed files, Jest may not emit a coverage summary.
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "No coverage summary found (likely no changed files vs origin/qa). Skipping extraction."
            exit 0
          fi

          # Use jq to read total coverage percentages.
          LINES_PCT=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          STATEMENTS_PCT=$(jq -r '.total.statements.pct' coverage/coverage-summary.json)
          BRANCHES_PCT=$(jq -r '.total.branches.pct' coverage/coverage-summary.json)
          FUNCTIONS_PCT=$(jq -r '.total.functions.pct' coverage/coverage-summary.json)

          echo "Current Line Coverage: $LINES_PCT%"
          echo "Current Statement Coverage: $STATEMENTS_PCT%"
          echo "Current Branch Coverage: $BRANCHES_PCT%"
          echo "Current Function Coverage: $FUNCTIONS_PCT%"

          # Write to GITHUB_OUTPUT (informational; consumed downstream if/when a gate or comment step is added).
          echo "lines=$LINES_PCT" >> $GITHUB_OUTPUT
          echo "statements=$STATEMENTS_PCT" >> $GITHUB_OUTPUT
          echo "branches=$BRANCHES_PCT" >> $GITHUB_OUTPUT
          echo "functions=$FUNCTIONS_PCT" >> $GITHUB_OUTPUT

      - name: Deploy preview to Vercel (feature push)
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/qa' }}
        env:
          REF_NAME: ${{ github.ref_name }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          echo "Feature branch push detected. Proceeding with Preview deployment."
          CommitRef="$REF_NAME"
          echo "CommitRef is $CommitRef"
          npm install --global vercel@latest
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          vercel deploy -m githubDeployment=1 -m githubCommitRef="$CommitRef" --prebuilt --token="$VERCEL_TOKEN"

      - name: Check if its push to qa branch
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/qa' }}
        run: |
          echo "This is a push to qa branch. Deployment will be handled by Vercel automatically."
